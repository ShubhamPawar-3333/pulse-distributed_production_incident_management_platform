[project]
name = "pulse"
version = "0.1.0"
description = "Pulse - Distributed Production Incident Management Platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]==0.136.0",
    "uvicorn[standard]==0.52.0",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.18.5",
    "asyncpg==0.30.0",
    "pydantic==2.13.0",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.1.1",
    "structlog==25.4.0",
    "PyJWT==2.10.1",
    "bcrypt==4.3.0",
    "httpx==0.28.1",
    "redis==5.2.1",
    "confluent-kafka==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.11.13",
    "mypy==1.16.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]